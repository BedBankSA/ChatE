# ChatE CI — release quality gates for pushes and pull requests to main.
#
# No repository secrets are used. NEXT_PUBLIC_* values are public and are
# inlined into the browser bundle at build time, so CI uses dummy placeholders
# that are independent of any real provider account.
#
# Why the `next typegen` step exists: next-env.d.ts imports
# ./.next/types/routes.d.ts and ./.next/types/root-params.d.ts, so a fresh
# checkout cannot pass `tsc --noEmit` until Next generates those route types.
# `next typegen` does that without paying for a full build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public, non-secret build-time values. Do not add server secrets here.
  APP_URL: "http://localhost:3211"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "ci-dummy.apps.googleusercontent.com"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAACiDummySiteKey"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Next.js route types
        run: node node_modules/next/dist/bin/next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Client bundle secret scan
        run: npm run check:bundle
