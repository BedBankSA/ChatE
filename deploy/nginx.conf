# ChatE — nginx alternative to Caddy (TLS via certbot / Cloudflare origin cert).
# Install as /etc/nginx/sites-available/chate.conf, then:
#   ln -s /etc/nginx/sites-available/chate.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Replace chate.example.com, /etc/letsencrypt/live/chate.example.com/ paths.
#
# /etc/nginx/conf.d/chate-upstream.conf
upstream chate_web {
    server 127.0.0.1:3211;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS (certbot webroot challenge must stay reachable).
server {
    listen 80;
    listen [::]:80;
    server_name chate.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chate.example.com;

    ssl_certificate     /etc/letsencrypt/live/chate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chate.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # MAX_FILE_BYTES=26214400 (25 MiB) + multipart/JSON overhead.
    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Proxy-side security headers; the app adds CSP, HSTS and frame protections.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # HSTS: only enable after HTTPS is proven for the domain. The app also emits
    # HSTS when NODE_ENV=production (next.config.ts), so this is belt-and-braces.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/chate-access.log;
    error_log  /var/log/nginx/chate-error.log warn;

    location / {
        proxy_pass http://chate_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        # Responses are client-polled JSON; buffering off keeps latency low and
        # is required if the app later streams.
        proxy_buffering off;
    }
}
